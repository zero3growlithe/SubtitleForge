name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The Whisper.net CUDA 12 natives are a NuGet runtime asset, so they land in
      # runtimes\cuda12\win-<arch> all by themselves — the only layout whisper.net probes. The CPU
      # natives in runtimes\win-<arch> stay: they are the fallback the loader walks to when CUDA is
      # not there, so a machine without an NVIDIA card still transcribes.
      - name: Restore
        run: dotnet restore SubtitleForge/SubtitleForge.csproj -r win-x64 -p:EnableCuda=true

      - name: Build
        run: dotnet build SubtitleForge/SubtitleForge.csproj -c Release -r win-x64 --no-restore -p:EnableCuda=true

      - name: Publish
        run: dotnet publish SubtitleForge/SubtitleForge.csproj -c Release -r win-x64 --self-contained false --no-restore -p:EnableCuda=true -o publish

      - name: List publish output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse publish | Measure-Object -Property Length -Sum | ForEach-Object { "files={0} bytes={1}" -f $_.Count, $_.Sum }
          Get-ChildItem -Recurse publish -Filter *.dll | Where-Object { $_.FullName -like "*runtimes*" } | Select-Object FullName
          # The CUDA natives are stripped in the next step, so what matters here is that the layout
          # whisper.net probes exists at all and that the CPU fallback is intact.
          if (-not (Test-Path "publish/runtimes/cuda12")) { throw "runtimes\cuda12 is missing from the publish output" }
          if (-not (Test-Path "publish/runtimes/win-x64/whisper.dll")) { throw "The CPU runtime is missing from the publish output" }

      # ggml-cuda-whisper.dll alone is 538 MB, so it is not shipped. The folder layout stays, empty
      # except for a note, because runtimes\cuda12\win-<arch> is the only place whisper.net probes:
      # an empty folder makes it walk on to the CPU runtime, and dropping the files in later turns GPU
      # transcription on without touching the build.
      - name: Empty the CUDA folder but keep it
        shell: pwsh
        run: |
          $cudaRoot = Join-Path $PWD "publish/runtimes/cuda12"
          if (-not (Test-Path $cudaRoot)) { throw "runtimes\cuda12 is missing from the publish output" }

          $note = @(
            "The CUDA whisper natives are deliberately not part of this build:",
            "ggml-cuda-whisper.dll alone is 538 MB.",
            "",
            "To turn GPU transcription on, copy the whole folder",
            "  runtimes\cuda12\win-x64",
            "from the NuGet package Whisper.net.Runtime.Cuda12.Windows 1.9.1 into this one, so that",
            "this directory ends up holding:",
            "  ggml-cuda-whisper.dll  ggml-whisper.dll  ggml-base-whisper.dll",
            "  ggml-cpu-whisper.dll   whisper.dll",
            "",
            "Package: https://www.nuget.org/api/v2/package/Whisper.net.Runtime.Cuda12.Windows/1.9.1",
            "(it is a plain zip; only its runtimes folder is needed).",
            "",
            "The remaining CUDA libraries (cublas64_12, cublasLt64_12, cudart64_12) come from the CUDA 12",
            "toolkit: SubtitleForge adds the toolkit's bin folder to the DLL search path at start-up.",
            "GPU diagnostics in the app lists every file it looks for and where."
          )

          Get-ChildItem -Recurse $cudaRoot -File | ForEach-Object {
            "{0,10:N1} MB  removing {1}" -f ($_.Length / 1MB), $_.Name
            Remove-Item $_.FullName -Force
          }

          foreach ($folder in (Get-ChildItem -Directory $cudaRoot -Recurse)) {
            Set-Content -Path (Join-Path $folder.FullName "PUT-CUDA-LIBRARIES-HERE.txt") -Value $note -Encoding UTF8
          }

          Get-ChildItem -Recurse $cudaRoot | Select-Object FullName
          $big = Get-ChildItem -Recurse publish -File | Where-Object { $_.Length -gt 40MB }
          if ($big) { throw ("Oversized files left in the publish output: " + ($big.Name -join ", ")) }
          if (-not (Test-Path "publish/runtimes/win-x64/whisper.dll")) { throw "The CPU fallback runtime is missing" }

      - name: Archive
        shell: pwsh
        run: |
          Get-ChildItem publish -Directory | Select-Object Name
          Get-ChildItem publish/runtimes -Directory | Select-Object Name
          Compress-Archive -Path publish/* -DestinationPath SubtitleForge-win-x64.zip -Force
          Get-ChildItem SubtitleForge-win-x64.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleForge-win-x64
          path: SubtitleForge-win-x64.zip
