name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # One build only. The CUDA 12 whisper natives are a ~560 MB package that the CUDA toolkit
      # cannot replace, so they are not shipped: whoever wants GPU transcription installs the
      # Whisper.net CUDA runtime next to the executable (see the README).
      - name: Restore
        run: dotnet restore SubtitleForge/SubtitleForge.csproj -r win-x64 -p:EnableCuda=false

      - name: Build
        run: dotnet build SubtitleForge/SubtitleForge.csproj -c Release -r win-x64 --no-restore -p:EnableCuda=false

      - name: Publish
        run: dotnet publish SubtitleForge/SubtitleForge.csproj -c Release -r win-x64 --self-contained false --no-restore -p:EnableCuda=false -o publish

      - name: List publish output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse publish | Measure-Object -Property Length -Sum | ForEach-Object { "files={0} bytes={1}" -f $_.Count, $_.Sum }
          Get-ChildItem -Recurse publish -Filter *.dll | Where-Object { $_.FullName -like "*runtimes*" } | Select-Object FullName
          if (Get-ChildItem -Recurse publish -Filter ggml-cuda-whisper.dll) { throw "CUDA natives leaked into the build" }

      - name: Archive
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath SubtitleForge-win-x64.zip -Force
          Get-ChildItem SubtitleForge-win-x64.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleForge-win-x64
          path: SubtitleForge-win-x64.zip
