name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The Whisper.net CUDA 12 natives are a NuGet runtime asset, so they land in
      # runtimes\cuda12\win-<arch> all by themselves — the only layout whisper.net probes. The CPU
      # natives in runtimes\win-<arch> stay: they are the fallback the loader walks to when CUDA is
      # not there, so a machine without an NVIDIA card still transcribes.
      - name: Restore
        run: dotnet restore SubtitleForge/SubtitleForge.csproj -r win-x64 -p:EnableCuda=true

      - name: Build
        run: dotnet build SubtitleForge/SubtitleForge.csproj -c Release -r win-x64 --no-restore -p:EnableCuda=true

      - name: Publish
        run: dotnet publish SubtitleForge/SubtitleForge.csproj -c Release -r win-x64 --self-contained false --no-restore -p:EnableCuda=true -o publish

      - name: List publish output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse publish | Measure-Object -Property Length -Sum | ForEach-Object { "files={0} bytes={1}" -f $_.Count, $_.Sum }
          Get-ChildItem -Recurse publish -Filter *.dll | Where-Object { $_.FullName -like "*runtimes*" } | Select-Object FullName
          # The CUDA natives are stripped in the next step, so what matters here is that the layout
          # whisper.net probes exists at all and that the CPU fallback is intact.
          if (-not (Test-Path "publish/runtimes/cuda12")) { throw "runtimes\cuda12 is missing from the publish output" }
          if (-not (Test-Path "publish/runtimes/win-x64/whisper.dll")) { throw "The CPU runtime is missing from the publish output" }

      # Only ggml-cuda-whisper.dll (538 MB) is kept out of the build. The other four CUDA natives are
      # shipped, because they are NOT the same files as the CPU runtime's copies: the CUDA package's
      # ggml-whisper.dll imports ggml_backend_cuda_reg from ggml-cuda-whisper.dll, and that static
      # import is the only thing that ever puts the CUDA backend into ggml's registry. Hand-copying
      # "the CUDA folder" used to mix the two sets, and a mixed set fails silently: whisper reports
      # backends = 1 and "no GPU found" while every file is present and loads fine.
      - name: Strip the 538 MB CUDA module, verify the rest of the set
        shell: pwsh
        run: |
          $cudaRoot = Join-Path $PWD "publish/runtimes/cuda12"
          if (-not (Test-Path $cudaRoot)) { throw "runtimes\cuda12 is missing from the publish output" }
          $cudaFolder = Join-Path $cudaRoot "win-x64"

          $note = @(
            "ggml-cuda-whisper.dll is the one CUDA whisper native that is not part of this build:",
            "it is 538 MB on its own.",
            "",
            "To turn GPU transcription on, copy just that one file next to this note, so this folder",
            "ends up holding:",
            "  ggml-cuda-whisper.dll   (the file you copy in)",
            "  whisper.dll  ggml-whisper.dll  ggml-base-whisper.dll  ggml-cpu-whisper.dll  (already here)",
            "",
            "It is inside the NuGet package Whisper.net.Runtime.Cuda12.Windows 1.9.1:",
            "https://www.nuget.org/api/v2/package/Whisper.net.Runtime.Cuda12.Windows/1.9.1",
            "(a plain zip - the file sits in build/win-x64/, not in a runtimes folder).",
            "",
            "Do NOT copy whisper.dll, ggml-whisper.dll or ggml-base-whisper.dll from Whisper.net.Runtime:",
            "those are the CPU builds, and with a CPU ggml-whisper.dll in here CUDA is never registered.",
            "",
            "The remaining CUDA libraries (cublas64_12, cublasLt64_12, cudart64_12) come from the CUDA 12",
            "toolkit: SubtitleForge adds the toolkit's bin folder to the DLL search path at start-up.",
            "GPU diagnostics in the app lists every file it looks for and where."
          )

          $big = Join-Path $cudaFolder "ggml-cuda-whisper.dll"
          if (Test-Path $big) {
            "{0,10:N1} MB  removing {1}" -f ((Get-Item $big).Length / 1MB), "ggml-cuda-whisper.dll"
            Remove-Item $big -Force
          }

          Set-Content -Path (Join-Path $cudaFolder "PUT-CUDA-LIBRARIES-HERE.txt") -Value $note -Encoding UTF8

          # The four shipped natives have to be there and the CUDA ggml-whisper.dll has to be the CUDA
          # build - the whole point of shipping them. The import name is plain ASCII in the PE, so a
          # byte search is enough and it cannot be fooled by a file that merely has the right name.
          foreach ($file in @("whisper.dll","ggml-whisper.dll","ggml-base-whisper.dll","ggml-cpu-whisper.dll")) {
            $path = Join-Path $cudaFolder $file
            if (-not (Test-Path $path)) { throw "The CUDA set is incomplete: $file is missing from runtimes\cuda12\win-x64" }
          }

          $bytes = [System.IO.File]::ReadAllBytes((Join-Path $cudaFolder "ggml-whisper.dll"))
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $text.Contains("ggml_backend_cuda_reg")) {
            throw "runtimes\cuda12\win-x64\ggml-whisper.dll is the CPU build (no ggml_backend_cuda_reg import), so CUDA would never register"
          }

          # And it must not be the same file as the CPU fallback's copy, or one of the two sets is wrong.
          $cudaGgml = (Get-FileHash (Join-Path $cudaFolder "ggml-whisper.dll") -Algorithm SHA256).Hash
          $cpuGgml  = (Get-FileHash "publish/runtimes/win-x64/ggml-whisper.dll" -Algorithm SHA256).Hash
          if ($cudaGgml -eq $cpuGgml) { throw "The CUDA and CPU ggml-whisper.dll are the same file: the publish merged the two native sets" }
          Write-Host "CUDA ggml-whisper.dll imports ggml_backend_cuda_reg and differs from the CPU copy ($($cudaGgml.Substring(0,16)))"

          Get-ChildItem -Recurse $cudaRoot | Select-Object FullName
          $oversized = Get-ChildItem -Recurse publish -File | Where-Object { $_.Length -gt 40MB }
          if ($oversized) { throw ("Oversized files left in the publish output: " + ($oversized.Name -join ", ")) }
          if (-not (Test-Path "publish/runtimes/win-x64/whisper.dll")) { throw "The CPU fallback runtime is missing" }

      - name: Archive
        shell: pwsh
        run: |
          Get-ChildItem publish -Directory | Select-Object Name
          Get-ChildItem publish/runtimes -Directory | Select-Object Name
          Compress-Archive -Path publish/* -DestinationPath SubtitleForge-win-x64.zip -Force
          Get-ChildItem SubtitleForge-win-x64.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleForge-win-x64
          path: SubtitleForge-win-x64.zip
