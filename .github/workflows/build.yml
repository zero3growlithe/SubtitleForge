name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The Whisper.net CUDA 12 natives are a NuGet runtime asset, so they land in
      # runtimes\cuda12\win-<arch> all by themselves — the only layout whisper.net probes. The CPU
      # natives in runtimes\win-<arch> stay: they are the fallback the loader walks to when CUDA is
      # not there, so a machine without an NVIDIA card still transcribes.
      - name: Restore
        run: dotnet restore SubtitleForge/SubtitleForge.csproj -r win-x64 -p:EnableCuda=true

      - name: Build
        run: dotnet build SubtitleForge/SubtitleForge.csproj -c Release -r win-x64 --no-restore -p:EnableCuda=true

      - name: Publish
        run: dotnet publish SubtitleForge/SubtitleForge.csproj -c Release -r win-x64 --self-contained false --no-restore -p:EnableCuda=true -o publish

      - name: List publish output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse publish | Measure-Object -Property Length -Sum | ForEach-Object { "files={0} bytes={1}" -f $_.Count, $_.Sum }
          Get-ChildItem -Recurse publish -Filter *.dll | Where-Object { $_.FullName -like "*runtimes*" } | Select-Object FullName
          $cuda = Get-ChildItem -Recurse publish -Filter ggml-cuda-whisper.dll | ForEach-Object { $_.FullName }
          if (-not $cuda) { throw "The CUDA 12 natives are missing from the publish output" }
          $cuda | ForEach-Object { "cuda native: $_" }
          # whisper.net only loads a runtime from runtimes\<runtime>\win-<arch>, so the CUDA copy has
          # to sit under cuda12 or GPU transcription stays on the CPU.
          if (-not ($cuda | Where-Object { $_ -like "*\runtimes\cuda12\win-*" })) { throw "The CUDA natives are not in runtimes\cuda12\win-<arch>" }

      # The cuBLAS / cuDNN blobs are hundreds of megabytes and every CUDA toolkit already contains
      # them, so they are not shipped. The folder and its own native (ggml-cuda-whisper.dll) stay, with
      # a note inside, so the two or three files can be dropped in by hand if there is no toolkit.
      - name: Trim the CUDA blobs
        shell: pwsh
        run: |
          $cudaRoot = Join-Path $PWD "publish/runtimes/cuda12"
          if (-not (Test-Path $cudaRoot)) { throw "runtimes\cuda12 is missing from the publish output" }

          $removed = @()
          Get-ChildItem -Recurse $cudaRoot -Filter *.dll | ForEach-Object {
            "{0,10:N1} MB  {1}" -f ($_.Length / 1MB), $_.FullName
            if ($_.Name -like "cublas*.dll" -or $_.Name -like "cudnn*.dll") {
              $removed += ("{0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB))
              Remove-Item $_.FullName -Force
            }
          }

          $note = @(
            "The large CUDA libraries are deliberately not part of this build.",
            "",
            "whisper.cpp loads them at run time from the CUDA toolkit: SubtitleForge adds the",
            "toolkit's bin folder to the DLL search path when it starts. Install CUDA 12 (>= 12.4.1)",
            "and nothing has to be copied here.",
            "",
            "Without a toolkit, drop cublas64_12.dll, cublasLt64_12.dll and cudart64_12.dll into this",
            "folder instead - next to ggml-cuda-whisper.dll.",
            "",
            "GPU diagnostics in the app lists every file it looked for and where."
          )
          foreach ($folder in (Get-ChildItem -Directory $cudaRoot)) {
            Set-Content -Path (Join-Path $folder.FullName "PUT-CUDA-LIBRARIES-HERE.txt") -Value $note -Encoding UTF8
          }

          if ($removed.Count -eq 0) { "trimmed: nothing (the package no longer ships cuBLAS)" }
          else { "trimmed: " + ($removed -join ", ") }

      - name: Archive
        shell: pwsh
        run: |
          Get-ChildItem publish -Directory | Select-Object Name
          Get-ChildItem publish/runtimes -Directory | Select-Object Name
          Compress-Archive -Path publish/* -DestinationPath SubtitleForge-win-x64.zip -Force
          Get-ChildItem SubtitleForge-win-x64.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleForge-win-x64
          path: SubtitleForge-win-x64.zip
