name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SubtitleForge/SubtitleForge.csproj -r win-x64

      - name: Build
        run: dotnet build SubtitleForge/SubtitleForge.csproj -c Release -r win-x64 --no-restore

      - name: Publish
        run: dotnet publish SubtitleForge/SubtitleForge.csproj -c Release -r win-x64 --self-contained false --no-restore -o publish

      - name: List publish output
        run: Get-ChildItem -Recurse publish | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Archive
        run: Compress-Archive -Path publish/* -DestinationPath SubtitleForge-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleForge-win-x64
          path: SubtitleForge-win-x64.zip
